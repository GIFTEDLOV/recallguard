name: RecallGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gates:
    name: Contract, frontend, and provenance gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Direct Mode tests
        run: python -m pytest -q

      - name: Run decision-critical mutation tests
        run: python scripts/v2_mutation_test.py

      - name: Run GenVM AST lint
        run: genvm-lint lint contracts/recall_guard.py

      - name: Run GenVM semantic validation
        shell: bash
        run: |
          semantic_venv="${RUNNER_TEMP}/recallguard-genvm-semantic"
          python -m venv "$semantic_venv"
          "$semantic_venv/bin/python" -m pip install --upgrade pip
          "$semantic_venv/bin/python" -m pip install --no-cache-dir "genvm-linter==0.11.1rc2"
          env GENVM_VERSION=v0.6.0-rc5 "$semantic_venv/bin/genvm-lint" setup --contract contracts/recall_guard.py
          env GENVM_VERSION=v0.6.0-rc5 "$semantic_venv/bin/genvm-lint" validate contracts/recall_guard.py

      - name: Verify contract source and deployment provenance
        shell: bash
        run: |
          test "$(sha256sum contracts/recall_guard.py | awk '{print $1}')" = '814fd01cd7d1c1d6ab3c2789a54ee76432bdc1e8653b4658b2dfc2348b0a3f3d'
          grep -Fq '814fd01cd7d1c1d6ab3c2789a54ee76432bdc1e8653b4658b2dfc2348b0a3f3d' PROVENANCE.md
          grep -Fq '0x6E2EAfF16124c513022Ad85751fD4dfF8d7e5580' PROVENANCE.md
          grep -Fq '61997' PROVENANCE.md
          grep -Fq 'v2-stable-marketplace-reference' contracts/recall_guard.py
          grep -Fq 'v2-cpsc-recall-number' contracts/recall_guard.py
          grep -Fq 'STATE_UNASSESSED' contracts/recall_guard.py
          grep -Fq 'STATE_CLEARED' contracts/recall_guard.py
          grep -Fq 'STATE_REVIEW_REQUIRED' contracts/recall_guard.py
          grep -Fq 'STATE_BLOCKED' contracts/recall_guard.py
          grep -Fq '"recall_domains": ["saferproducts.gov"]' config/v2_source_policy.json
          grep -Fq '"marketplace_domains": ["amazon.com"]' config/v2_source_policy.json

      - name: Verify production configuration
        shell: bash
        run: |
          grep -Fq 'https://studio-dev.genlayer.com/api' frontend/lib/genlayer/client.ts
          grep -Fq 'studioDevnet' frontend/lib/genlayer/client.ts
          grep -Fq '61997' frontend/.env.example
          grep -Fq '0x6E2EAfF16124c513022Ad85751fD4dfF8d7e5580' frontend/.env.example
          ! grep -R -nE 'rpc-bradbury\.genlayer\.com|testnetBradbury|studio\.genlayer\.com|studionet|61999|4221|localhost:4000|0xf89F8CB2ddd201185d905107fDbA8bAeeDF066Ca|0xcB6688DcD30bDB97B882c02a1B1273914dcAB563' frontend/lib/genlayer frontend/lib/contracts frontend/.env.example

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test --workspace recallguard-frontend

      - name: Run TypeScript check
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Scan tracked source for private-key markers
        shell: bash
        run: |
          if rg -n --hidden -S 'PRIVATE_KEY|privateKey|PRIVATE_KEY_' \
            --glob '!node_modules/**' --glob '!frontend/.next/**' --glob '!.git/**' \
            --glob '!.github/workflows/ci.yml' .; then
            echo 'Potential secret marker found.'
            exit 1
          fi
          echo 'No private-key markers found.'
